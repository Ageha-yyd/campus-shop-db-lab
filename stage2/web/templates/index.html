<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>校园奶茶店 · 订单与库存</title><link rel="stylesheet" href="/static/style.css"><script src="/static/app.js" defer></script></head>
<body><header><div class="brand">茶间 <span>校园奶茶店</span></div><div id="identity">欢迎光临</div><button id="logout" class="quiet" hidden>退出登录</button></header>
<main>
<section id="login-panel" class="login"><div class="intro"><p class="eyebrow">CAMPUS TEA SHOP</p><h1>一杯好茶<br>从这里开始</h1><p>查看今日饮品，选择喜欢的口味。<br>登录后即可保存订单，交由店员确认制作。</p><div class="tea-art" aria-hidden="true">茶</div></div>
<form id="login-form" class="card"><p class="eyebrow">欢迎回来</p><h2>登录茶间</h2><label>用户名<input name="username" maxlength="40" autocomplete="username" required></label><label>密码<input name="password" type="password" maxlength="128" autocomplete="current-password" required></label><button type="submit">登录</button><p class="muted">使用分配给您的顾客、店员或管理员账号。</p></form></section>
<div id="workspace" hidden><div class="page-heading"><div><p class="eyebrow">今日营业</p><h1 id="welcome">饮品与订单</h1></div><span class="pill">校园单店 · 标准饮品</span></div>
<nav id="tabs"><button data-tab="products" class="selected">饮品菜单</button><button data-tab="orders">订单中心</button><button data-tab="inventory">库存查询</button><button data-tab="sales" id="sales-tab" hidden>销售统计</button></nav>
<section id="products-page" class="page"><div class="section-heading"><h2>今日菜单</h2><form id="search-form" class="inline"><input name="query" placeholder="搜索名称或编号" aria-label="搜索商品" maxlength="80"><button class="quiet">搜索</button></form></div><div id="product-grid" class="product-grid"></div>
<form id="product-form" class="card admin-only" hidden><h3 id="product-form-title">新增商品</h3><div class="fields"><label>商品编号<input name="product_code" required maxlength="12" pattern="[A-Za-z0-9_-]+"></label><label>饮品名称<input name="name" required maxlength="80"></label><label>类别<input name="category" required maxlength="30"></label><label>价格<input name="price" type="number" required min="0.01" max="99999999.99" step="0.01"></label><label>预警杯数<input name="threshold" type="number" required min="1" max="1000000" step="1" value="10"></label><label>状态<select name="active"><option value="true">上架</option><option value="false">下架</option></select></label></div><div class="actions"><button>保存商品</button><button type="button" id="product-reset" class="quiet">清空表单</button></div></form></section>
<section id="orders-page" class="page" hidden><div class="section-heading"><div><h2>订单中心</h2><p class="muted" id="order-help"></p></div><button id="order-new" class="quiet">新建订单</button></div>
<form id="order-form" class="card"><h3 id="order-form-title">新建订单草稿</h3><p class="muted">保存草稿后由店员确认。修改草稿会按当前菜单重新报价。</p><label id="member-label">会员编号 可留空<input name="member_code" maxlength="12" placeholder="例如 M001"></label><div id="line-editor"></div><div class="actions"><button type="button" id="line-add" class="quiet">添加明细</button><button type="submit">保存草稿</button></div></form><div id="orders-table" class="table-wrap"></div><div id="order-detail" class="card" hidden></div></section>
<section id="inventory-page" class="page" hidden><div class="section-heading"><h2>库存与预警</h2><button id="inventory-refresh" class="quiet">刷新库存</button></div><div id="inventory-table" class="table-wrap"></div>
<form id="stock-form" class="card admin-only" hidden><h3>库存盘点与登记</h3><p class="muted">填写盘点后的可售杯数。删除库存记录前请先将数量调整为零。</p><div class="fields"><label>商品编号<input name="product_code" required maxlength="12"></label><label>盘点杯数<input name="quantity" type="number" min="0" max="1000000" step="1" required></label></div><div class="actions"><button>保存库存</button></div></form></section>
<section id="sales-page" class="page" hidden><h2>完成订单销售统计</h2><p class="muted">草稿与已取消订单不计入销售。</p><div id="sales-table" class="table-wrap"></div></section></div>
<div id="notice" role="status" aria-live="polite" hidden></div>
</main><footer>茶间 · 校园奶茶店数据库应用 <span>第二阶段 v1.0</span></footer></body></html>
