<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1400" viewBox="0 0 1680 1400">
<style>text{font-family:Arial,"Microsoft YaHei",sans-serif;fill:#20382c;font-size:23px}.title{font-size:30px;font-weight:bold}.heading{font-size:27px;font-weight:bold}.card{fill:#fff;stroke:#829984;stroke-width:2}.label{font-size:22px;font-weight:bold;paint-order:stroke;stroke:white;stroke-width:8px;stroke-linejoin:round}</style>
<rect width="1680" height="1400" fill="white"/>
<text x="35" y="48" class="title">校园奶茶店 v0.1 实体联系图</text>
<text x="35" y="90">PK 主码   AK 候选码   FK 外码   ? 可空   min..max 为该端可关联记录数   * 见业务规则</text>
<polyline points="455,310 625,310" fill="none" stroke="#627d64" stroke-width="3"/>
<text x="468" y="296" class="label">1</text>
<text x="560" y="296" class="label">0..N</text>
<text x="485" y="355" style="font-size:20px">经办</text>
<polyline points="1215,310 1045,310" fill="none" stroke="#627d64" stroke-width="3"/>
<text x="1150" y="296" class="label">0..1</text>
<text x="1058" y="296" class="label">0..N</text>
<text x="1080" y="355" style="font-size:20px">归属会员</text>
<polyline points="835,440 835,800" fill="none" stroke="#627d64" stroke-width="3"/>
<text x="848" y="473" class="label">1</text>
<text x="848" y="786" class="label">1..N*</text>
<text x="858" y="675" style="font-size:20px">包含</text>
<polyline points="455,970 625,970" fill="none" stroke="#627d64" stroke-width="3"/>
<text x="468" y="956" class="label">1</text>
<text x="560" y="956" class="label">0..N</text>
<text x="480" y="1015" style="font-size:20px">对应饮品</text>
<polyline points="245,1110 245,1225 1425,1225 1425,1110" fill="none" stroke="#627d64" stroke-width="3"/>
<text x="258" y="1143" class="label">1</text>
<text x="1438" y="1143" class="label">0..1</text>
<text x="760" y="1260" style="font-size:20px">库存快照</text>
<g id="Employee"><rect x="35" y="130" width="420" height="310" rx="10" class="card"/>
<rect x="36" y="131" width="418" height="50" rx="8" fill="#e6eddf"/>
<text x="52" y="164" class="heading">Employee</text>
<text x="51" y="215">PK EmployeeCode</text>
<text x="51" y="251">DisplayName</text>
<text x="51" y="287">JobTitle</text>
<text x="51" y="323">IsActive</text>
</g>
<g id="ShopOrder"><rect x="625" y="130" width="420" height="310" rx="10" class="card"/>
<rect x="626" y="131" width="418" height="50" rx="8" fill="#e6eddf"/>
<text x="642" y="164" class="heading">ShopOrder</text>
<text x="641" y="215">PK OrderNo</text>
<text x="641" y="251">OrderedAt</text>
<text x="641" y="287">FK EmployeeCode</text>
<text x="641" y="323">FK MemberCode ?</text>
<text x="641" y="359">Status</text>
</g>
<g id="Member"><rect x="1215" y="130" width="420" height="310" rx="10" class="card"/>
<rect x="1216" y="131" width="418" height="50" rx="8" fill="#e6eddf"/>
<text x="1232" y="164" class="heading">Member</text>
<text x="1231" y="215">PK MemberCode</text>
<text x="1231" y="251">DisplayName</text>
<text x="1231" y="287">Phone ? UNIQUE if not null</text>
<text x="1231" y="323">JoinedAt</text>
</g>
<g id="Product"><rect x="35" y="800" width="420" height="310" rx="10" class="card"/>
<rect x="36" y="801" width="418" height="50" rx="8" fill="#e6eddf"/>
<text x="52" y="834" class="heading">Product</text>
<text x="51" y="885">PK ProductCode</text>
<text x="51" y="921">ProductName</text>
<text x="51" y="957">Category</text>
<text x="51" y="993">UnitPrice</text>
<text x="51" y="1029">RestockThreshold</text>
<text x="51" y="1065">IsActive</text>
</g>
<g id="OrderLine"><rect x="625" y="800" width="420" height="310" rx="10" class="card"/>
<rect x="626" y="801" width="418" height="50" rx="8" fill="#e6eddf"/>
<text x="642" y="834" class="heading">OrderLine</text>
<text x="641" y="885">PK FK OrderNo</text>
<text x="641" y="921">PK LineNumber</text>
<text x="641" y="957">FK ProductCode</text>
<text x="641" y="993">Quantity</text>
<text x="641" y="1029">UnitPrice (historical)</text>
</g>
<g id="Inventory"><rect x="1215" y="800" width="420" height="310" rx="10" class="card"/>
<rect x="1216" y="801" width="418" height="50" rx="8" fill="#e6eddf"/>
<text x="1232" y="834" class="heading">Inventory</text>
<text x="1231" y="885">PK FK ProductCode</text>
<text x="1231" y="921">Quantity</text>
<text x="1231" y="957">UpdatedAt</text>
</g>
<text x="35" y="1350">* 订单至少一行是业务要求；v0.1外码不能保证，v1.0由事务过程实现。</text>
</svg>